name: 构建并发布 exe

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 设置 MSVC 环境（arm64 交叉编译需要对应链接器）
        if: matrix.target == 'aarch64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: 缓存 cargo 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: 构建发布版 exe
        run: cargo build --release --target ${{ matrix.target }}

      - name: 按架构重命名并上传 exe
        shell: powershell
        run: |
          $arch = if ('${{ matrix.target }}' -eq 'aarch64-pc-windows-msvc') { 'arm64' } else { 'x64' }
          # 使用触发的 tag 名作为版本号（保留 v 前缀，如 v1.1.0）
          $version = '${{ github.ref_name }}'
          Copy-Item "target/${{ matrix.target }}/release/input_snap.exe" "input_snap-$version-$arch.exe"

      - name: 上传 exe 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: input_snap-${{ matrix.target }}
          path: input_snap-*.exe

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 创建 GitHub Release 并上传 exe
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.exe
          generate_release_notes: true
name: 构建 exe 安装包

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 设置 MSVC 环境（arm64 交叉编译需要对应链接器）
        if: matrix.target == 'aarch64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: 缓存 cargo 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: 构建发布版 exe
        run: cargo build --release --target ${{ matrix.target }}

      - name: 上传 exe 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: input_snap-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/input_snap.exe
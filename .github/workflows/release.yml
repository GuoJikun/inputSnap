name: 构建 exe 安装包

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 构建发布版 exe
        run: cargo build --release

      - name: 上传 exe 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: input_snap-exe
          path: target/release/input_snap.exe
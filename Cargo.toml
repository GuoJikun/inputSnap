[package]
name = "InputSnap"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "input_snap"
path = "src/main.rs"

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_Graphics_Gdi",
] }
log = "0.4"
fern = "0.7"
chrono = "0.4"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "s"
lto = false
strip = false
